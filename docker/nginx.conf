server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # CSP — Leptos CSR: inline scripts from Trunk, external .js/.wasm bundles,
    # Google Fonts, favicon as data: URI.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; base-uri 'self'; form-action 'self'" always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Favicon — respond 204 instead of 404
    location = /favicon.ico {
        return 204;
    }

    # WASM bundles — long cache, immutable
    types {
        application/wasm wasm;
    }
    location ~* \.(wasm)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # JS/CSS bundles — long cache
    location ~* \.(js|css)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Other static assets
    location ~* \.(woff2|woff|ttf|svg|png|jpg|ico)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Gzip compression
    gzip on;
    gzip_types text/html text/css application/javascript application/json application/wasm image/svg+xml;
    gzip_min_length 256;

    # Healthcheck endpoint
    location = /health {
        access_log off;
        return 200 "ok";
    }
}
